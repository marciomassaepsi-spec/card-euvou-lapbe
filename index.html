<style>
/* Layout: uma coluna estreita, celular primeiro — passos 1-2, prévia do story, botão de baixar */
:root {
  --navy: #0E2244;
  --navy-2: #17325C;
  --navy-3: #23477D;
  --cream: #F2F0EB;
  --sky: #A7BBD6;
  --muted: #BFCBDD;
  --display: "Playfair Display", Georgia, "Times New Roman", serif;
  --body: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--navy);
  color: var(--cream);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 520px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
header { display: flex; align-items: center; gap: 14px; }
header img { width: 84px; height: auto; flex: none; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sky); }
h1 { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1.1; margin: 2px 0 0; text-wrap: balance; }
h1 span { color: var(--sky); }
.lead { margin: 0; color: var(--muted); }
.step { display: flex; flex-direction: column; gap: 10px; }
.step-label { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.num { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--sky); color: var(--sky); display: grid; place-items: center; font-size: 14px; font-weight: 700; flex: none; }
.file-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 12px 18px; border-radius: 12px;
  border: 2px dashed var(--sky); color: var(--cream); background: var(--navy-2);
  font-weight: 600; cursor: pointer;
}
.file-btn:hover { background: var(--navy-3); }
#foto { position: absolute; width: 1px; height: 1px; opacity: 0; }
#foto:focus-visible + .file-btn { outline: 3px solid var(--sky); outline-offset: 3px; }
input[type="text"] {
  width: 100%; min-height: 52px; padding: 12px 16px; border-radius: 12px;
  border: 2px solid var(--navy-3); background: var(--navy-2); color: var(--cream);
  font-family: var(--display); font-style: italic; font-weight: 700; font-size: 20px;
}
input[type="text"]::placeholder { color: #8FA2BF; }
input[type="text"]:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; border-color: var(--sky); }
.adjust { display: grid; gap: 10px; padding: 14px 16px; border-radius: 12px; background: var(--navy-2); }
.adjust label { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
input[type="range"] { width: 100%; accent-color: var(--sky); min-height: 32px; }
.preview { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,0.45); background: var(--navy-2); aspect-ratio: 9 / 16; max-width: 100%; }
.preview img { display: block; width: 100%; height: 100%; -webkit-touch-callout: default; }
.hint { margin: 0; font-size: 14px; color: var(--muted); text-align: center; }
.save {
  min-height: 56px; border: 0; border-radius: 999px; background: var(--cream); color: var(--navy);
  font-family: var(--body); font-weight: 700; font-size: 17px; letter-spacing: 0.02em; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.save:hover { background: #FFFFFF; }
.save:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.save:disabled { opacity: 0.6; cursor: progress; }
.status { min-height: 1.5em; margin: 0; text-align: center; font-size: 14px; color: var(--sky); }
footer { text-align: center; font-size: 13px; color: #8FA2BF; }
@media (prefers-reduced-motion: no-preference) { .save { transition: background 0.15s; } }
</style>

  const canvas = document.getElementById("tela");
  const ctx = canvas.getContext("2d");
  const previa = document.getElementById("previa");
  const nomeEl = document.getElementById("nome");
  const fotoEl = document.getElementById("foto");
  const zoomEl = document.getElementById("zoom");
  const posxEl = document.getElementById("posx");
  const posyEl = document.getElementById("posy");
  const statusEl = document.getElementById("status");
  const baixarBtn = document.getElementById("baixar");

  let foto = null;
  let crest = null, crestWhite = null;
  let previewUrl = null;
  let pending = 0;

  function loadImg(src) {
    return new Promise(function (res) {
      const i = new Image();
      i.onload = function () { res(i); };
      i.onerror = function () { res(null); };
      i.src = src;
    });
  }

  function spaced(text, px) {
    try { ctx.letterSpacing = px + "px"; } catch (e) {}
  }

  function leaf(x, y, ang, L, Wd) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(L / 2, -Wd, L, 0);
    ctx.quadraticCurveTo(L / 2, Wd, 0, 0);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    spaced("", 0);

    // Fundo
    const g = ctx.createRadialGradient(540, 880, 40, 540, 880, 1050);
    g.addColorStop(0, C.navy3);
    g.addColorStop(0.48, "#142D57");
    g.addColorStop(1, C.navy);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (crestWhite) {
      ctx.globalAlpha = 0.05;
      const wmH = 1200 * crestWhite.height / crestWhite.width;
      ctx.drawImage(crestWhite, -60, 1097 - wmH / 2, 1200, wmH);
      ctx.globalAlpha = 1;
    }

    // Cantos diagonais, como no crachá
    ctx.fillStyle = C.sky;
    ctx.beginPath(); ctx.moveTo(W - 380, 0); ctx.lineTo(W, 0); ctx.lineTo(W, 270); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, H - 300); ctx.lineTo(420, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(167,187,214,0.6)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W - 450, 0); ctx.lineTo(W, 320); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, H - 357); ctx.lineTo(500, H); ctx.stroke();

    // Cartão com a logo
    ctx.save();
    ctx.translate(540, 300);
    ctx.rotate(-2 * Math.PI / 180);
    ctx.strokeStyle = C.sky; ctx.lineWidth = 3;
    ctx.strokeRect(-430 + 18 + 1.5, -150 + 18 + 1.5, 857, 297);
    ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 50; ctx.shadowOffsetY = 24;
    ctx.fillStyle = C.cream;
    ctx.fillRect(-430, -150, 860, 300);
    ctx.shadowColor = "transparent";

    ctx.font = "900 118px " + DISPLAY;
    spaced("", 2);
    const wLapbe = ctx.measureText("LAPBE").width;
    ctx.font = "600 17px " + BODY;
    spaced("", 3.4);
    const wSub = Math.max(ctx.measureText("DIAGNÓSTICO E INTERVENÇÃO DOS").width, ctx.measureText("TRANSTORNOS DE HUMOR").width);
    const textW = Math.max(wLapbe, wSub);
    const crestH = 200, crestW = crest ? crestH * crest.width / crest.height : 236, gap = 26;
    const total = crestW + gap + 3 + gap + textW;
    let x0 = -total / 2;
    if (crest) ctx.drawImage(crest, x0, -crestH / 2, crestW, crestH);
    ctx.fillStyle = C.navy2;
    ctx.fillRect(x0 + crestW + gap, -95, 3, 190);
    const tx = x0 + crestW + gap + 3 + gap;
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";
    ctx.font = "800 36px " + DISPLAY; spaced("", 2);
    ctx.fillText("I SIMPÓSIO", tx, -76);
    ctx.font = "900 118px " + DISPLAY; spaced("", 2);
    ctx.fillText("LAPBE", tx, 30);
    ctx.fillRect(tx, 48, textW, 2);
    ctx.font = "600 17px " + BODY; spaced("", 3.4);
    ctx.fillText("DIAGNÓSTICO E INTERVENÇÃO DOS", tx, 80);
    ctx.fillText("TRANSTORNOS DE HUMOR", tx, 105);
    ctx.restore();
    spaced("", 0);

    // Coroa de louros em volta da foto
    const cx = 540, cy = 900, R = 372;
    ctx.fillStyle = C.sky;
    ctx.strokeStyle = C.sky;
    ctx.lineWidth = 4;
    [1, -1].forEach(function (side) {
      ctx.beginPath();
      for (let d = 112; d <= 248; d += 2) {
        const a = d * Math.PI / 180;
        const x = side === 1 ? cx + R * Math.cos(a) : cx - R * Math.cos(a);
        const y = cy + R * Math.sin(a);
        if (d === 112) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      for (let d = 118; d <= 246; d += 13) {
        const a = d * Math.PI / 180;
        let x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
        let tdx = -Math.sin(a), tdy = Math.cos(a);
        if (side === -1) { x = 2 * cx - x; tdx = -tdx; }
        const t = Math.atan2(tdy, tdx);
        const size = 1 - (d - 118) / 128 * 0.35;
        leaf(x, y, t - side * 0.55, 62 * size, 19 * size);
        leaf(x, y, t + side * 0.55, 62 * size, 19 * size);
      }
    });

    // Moldura e foto
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.4)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 30;
    ctx.fillStyle = C.cream;
    ctx.beginPath(); ctx.arc(cx, cy, 295, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = C.sky; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(cx, cy, 312, 0, Math.PI * 2); ctx.stroke();

    const r = 283;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    if (foto) {
      const z = parseFloat(zoomEl.value) || 1;
      const s = Math.max((2 * r) / foto.width, (2 * r) / foto.height) * z;
      const dw = foto.width * s, dh = foto.height * s;
      const maxX = (dw - 2 * r) / 2, maxY = (dh - 2 * r) / 2;
      const ox = -(parseFloat(posxEl.value) || 0) * maxX;
      const oy = -(parseFloat(posyEl.value) || 0) * maxY;
      ctx.drawImage(foto, cx - dw / 2 + ox, cy - dh / 2 + oy, dw, dh);
    } else {
      ctx.fillStyle = "#C4D2E4";
      ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
      ctx.fillStyle = "#8CA4C6";
      ctx.beginPath(); ctx.arc(cx, cy - 40, 105, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx, cy + 250, 210, 190, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.navy2;
      ctx.font = "700 34px " + BODY; ctx.textAlign = "center";
      spaced("", 3);
      ctx.fillText("SUA FOTO AQUI", cx, cy - 190);
      spaced("", 0);
    }
    ctx.restore();

    // Faixa com o nome
    const nome = (nomeEl.value || "").trim() || "Seu nome";
    let fs = 46;
    ctx.font = "italic 700 " + fs + "px " + DISPLAY;
    let nw = ctx.measureText(nome).width;
    while (nw > 760 && fs > 26) { fs -= 2; ctx.font = "italic 700 " + fs + "px " + DISPLAY; nw = ctx.measureText(nome).width; }
    const bw = Math.max(nw + 110, 380), bh = 82, by = 1166;
    const bx = cx - bw / 2, notch = 24;
    ctx.fillStyle = "#C9D3E2";
    ctx.beginPath();
    ctx.moveTo(bx - 40, by + 20); ctx.lineTo(bx + 30, by + 20); ctx.lineTo(bx + 30, by + bh + 20); ctx.lineTo(bx - 40, by + bh + 20); ctx.lineTo(bx - 40 + notch, by + 20 + bh / 2); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx + bw + 40, by + 20); ctx.lineTo(bx + bw - 30, by + 20); ctx.lineTo(bx + bw - 30, by + bh + 20); ctx.lineTo(bx + bw + 40, by + bh + 20); ctx.lineTo(bx + bw + 40 - notch, by + 20 + bh / 2); ctx.closePath(); ctx.fill();
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 28; ctx.shadowOffsetY = 14;
    ctx.fillStyle = C.cream;
    ctx.fillRect(bx, by, bw, bh);
    ctx.restore();
    ctx.fillStyle = C.navy;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(nome, cx, by + bh / 2 + 2);
    ctx.textBaseline = "alphabetic";

    // #EU VOU!
    let hs = 196;
    ctx.font = "900 " + hs + "px " + DISPLAY;
    spaced("", 2);
    while ((ctx.measureText("#EU VOU!").width) > 940 && hs > 120) { hs -= 4; ctx.font = "900 " + hs + "px " + DISPLAY; }
    const wHash = ctx.measureText("#").width, wRest = ctx.measureText("EU VOU!").width;
    const hx = cx - (wHash + wRest) / 2;
    ctx.textAlign = "left";
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
    ctx.fillStyle = C.sky; ctx.fillText("#", hx, 1462);
    ctx.fillStyle = C.cream; ctx.fillText("EU VOU!", hx + wHash, 1462);
    ctx.restore();
    spaced("", 0);

    // Data
    ctx.font = "700 46px " + BODY; spaced("", 6);
    const dw2 = ctx.measureText(DATA_TXT).width;
    ctx.fillStyle = C.cream; ctx.textAlign = "center";
    ctx.fillText(DATA_TXT, cx + 3, 1582);
    spaced("", 0);
    ctx.fillStyle = C.sky;
    ctx.fillRect(cx - dw2 / 2 - 22 - 80, 1565, 80, 3);
    ctx.fillRect(cx + dw2 / 2 + 22, 1565, 80, 3);

    // Selo do Instagram
    ctx.font = "700 34px " + BODY; spaced("", 1);
    const ig = "@ligapbe.unime";
    const iw = ctx.measureText(ig).width;
    const pw = 36 + 16 + iw + 88, ph = 74, px0 = cx - pw / 2, py0 = 1650;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.3)"; ctx.shadowBlur = 28; ctx.shadowOffsetY = 14;
    ctx.fillStyle = C.cream;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(px0, py0, pw, ph, ph / 2); else ctx.rect(px0, py0, pw, ph);
    ctx.fill();
    ctx.restore();
    const ix = px0 + 44, iy = py0 + ph / 2 - 18;
    ctx.strokeStyle = C.navy; ctx.lineWidth = 3.2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(ix + 4.5, iy + 4.5, 27, 27, 8); else ctx.rect(ix + 4.5, iy + 4.5, 27, 27);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(ix + 18, iy + 18, 6.5, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = C.navy;
    ctx.beginPath(); ctx.arc(ix + 26, iy + 10, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(ig, ix + 36 + 16, py0 + ph / 2 + 1);
    ctx.textBaseline = "alphabetic";
    spaced("", 0);

    ctx.restore();
  }

  let currentBlob = null, pendingBlob = false;
  function refresh() {
    const id = ++pending;
    pendingBlob = true;
    draw();
    canvas.toBlob(function (blob) {
      if (!blob || id !== pending) return;
      pendingBlob = false;
      currentBlob = blob;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(blob);
      previa.src = previewUrl;
    }, "image/jpeg", 0.95);
  }

  let timer = 0;
  function schedule() {
    clearTimeout(timer);
    pendingBlob = true;
    timer = setTimeout(refresh, 60);
  }

  fotoEl.addEventListener("change", function () {
    const f = fotoEl.files && fotoEl.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    loadImg(url).then(function (img) {
      if (!img) {
        statusEl.textContent = "Não consegui abrir essa imagem. Tente uma foto em JPG ou PNG.";
        return;
      }
      foto = img;
      zoomEl.value = 1; posxEl.value = 0; posyEl.value = 0;
      document.getElementById("ajuste").hidden = false;
      document.getElementById("foto-label").textContent = "Trocar foto";
      statusEl.textContent = "";
      refresh();
    });
  });
  [nomeEl, zoomEl, posxEl, posyEl].forEach(function (el) { el.addEventListener("input", schedule); });

  // No celular, abre a folha de compartilhamento (Salvar imagem, Instagram...); no computador, baixa o arquivo
  const podeCompartilhar = !!(navigator.canShare && window.matchMedia && window.matchMedia("(pointer: coarse)").matches &&
    navigator.canShare({ files: [new File([new Blob(["x"], { type: "image/jpeg" })], "teste.jpg", { type: "image/jpeg" })] }));
  if (podeCompartilhar) document.getElementById("baixar-label").textContent = "Salvar ou compartilhar story";

  function nomeArquivo() {
    const nome = (nomeEl.value || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    return "euvou-simposio-lapbe" + (nome ? "-" + nome : "") + ".jpg";
  }

  function baixarArquivo(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    statusEl.textContent = "Pronto! Agora é só postar nos stories e marcar @ligapbe.unime.";
  }

  baixarBtn.addEventListener("click", function () {
    clearTimeout(timer);
    const blob = currentBlob;
    if (!blob || pendingBlob) {
      statusEl.textContent = "Preparando a imagem… toque de novo em um instante.";
      refresh();
      return;
    }
    const filename = nomeArquivo();
    if (podeCompartilhar) {
      const file = new File([blob], filename, { type: "image/jpeg" });
      navigator.share({ files: [file] }).then(function () {
        statusEl.textContent = "Pronto! Agora é só postar nos stories e marcar @ligapbe.unime.";
      }).catch(function (e) {
        if (e && e.name === "AbortError") statusEl.textContent = "Tudo bem! Toque no botão de novo quando quiser salvar.";
        else baixarArquivo(blob, filename);
      });
    } else {
      baixarArquivo(blob, filename);
    }
  });

  Promise.all([loadImg(document.getElementById("brasao").src), loadImg(CREST_WHITE_SRC)]).then(function (imgs) {
    crest = imgs[0]; crestWhite = imgs[1];
    const fontLoads = [
      '900 196px "Playfair Display"', '800 36px "Playfair Display"', 'italic 700 46px "Playfair Display"',
      '600 17px "Libre Franklin"', '700 46px "Libre Franklin"'
    ].map(function (f) { return document.fonts ? document.fonts.load(f, "ÍSIMPÓSIOLAPBE#EUVOU!") : Promise.resolve(); });
    const timeout = new Promise(function (res) { setTimeout(res, 2500); });
    Promise.race([Promise.all(fontLoads), timeout]).then(refresh);
    refresh();
  });

})();
</script>
